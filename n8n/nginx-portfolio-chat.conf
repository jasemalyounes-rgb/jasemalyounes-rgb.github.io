# Public HTTPS endpoint for the portfolio chat widget (jasemalyounes-rgb.github.io).
# Exposes ONLY the "Portfolio site — chatbot" n8n chat webhook; the n8n editor
# and every other webhook stay private on 127.0.0.1:5678.
# Installed as /etc/nginx/sites-available/portfolio-chat (symlinked into sites-enabled).

limit_req_zone $binary_remote_addr zone=portfolio_chat:10m rate=20r/m;

server {
    listen 8447 ssl;
    server_name 163.245.218.21;

    ssl_certificate     /etc/letsencrypt/live/163.245.218.21/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/163.245.218.21/privkey.pem;

    client_max_body_size 16k;
    access_log /var/log/nginx/portfolio-chat.access.log;
    error_log  /var/log/nginx/portfolio-chat.error.log;

    location = /webhook/3a9c9ab7-8f8d-4c99-9e07-56a3f1fa0a65/chat {
        limit_req zone=portfolio_chat burst=6 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
